<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Celeste Tracker</title>
  <link rel="icon" type="image/png" href="/icon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Celeste Tracker</h1>
      <span id="summary" class="figures">Loading your saves…</span>
    </div>
    <div class="actions">
      <span id="live" class="muted" title="The page reloads by itself when the game saves">● live</span>
      <button id="refresh" type="button" title="Read the Mods folder and all saves again">Refresh</button>
    </div>
  </header>

  <section class="toolbar" aria-label="Filters">
    <input id="q" type="search" placeholder="Search by mod name, author, ID, level set or chapter (press /)" autocomplete="off">
    <label>Slot <select id="slot"></select></label>
    <label>Show <select id="show">
      <option value="all" data-label="All mods">All mods</option>
      <option value="playing" data-label="In progress">In progress</option>
      <option value="complete" data-label="Completed">Completed</option>
      <option value="notstarted" data-label="Not started">Not started</option>
    </select></label>
    <details id="cols-menu" class="cols-menu">
      <summary title="Show or hide columns">Columns</summary>
      <div id="cols" class="menu"></div>
    </details>
  </section>

  <section id="sessions" class="sessions" hidden></section>
  <main id="list" class="list" aria-live="polite"></main>
  <p id="error" class="error" hidden></p>

  <script src="/app.js"></script>
</body>
</html>
