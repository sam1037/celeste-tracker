# Builds the desktop app for Windows and macOS. A tag like v0.2.0 also publishes them as a GitHub release;
# pull requests and "Run workflow" on the Actions tab build without publishing (the zips are kept on the run's page).
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            zip: CelesteTracker-windows.zip
          - os: macos-latest
            zip: CelesteTracker-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group build --extra desktop --python 3.12
      - run: uv run pyinstaller packaging/celeste-tracker.spec --noconfirm
      - if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/CelesteTracker -DestinationPath ${{ matrix.zip }}
      - if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Celeste Tracker.app" ${{ matrix.zip }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" CelesteTracker-*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
