[project]
name = "celeste-tracker"
version = "0.1.0"
description = "Track Celeste (Everest) mod progress from save files, without loading the mods"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
