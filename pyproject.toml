[project]
name = "celeste-tracker"
version = "0.1.0"
description = "Track Celeste (Everest) mod progress from save files, without loading the mods"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
desktop = [
    "pywebview>=6.2.1",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
